<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          if (localStorage.getItem('portfolio-theme') === 'light') {
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="robots" content="noindex, follow" />
    <title>404 — Página não encontrada | Walace Costa</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --color-canvas: 11 14 20;
        --color-panel: 18 21 29;
        --color-line: 35 40 56;
        --color-ink: 230 232 238;
        --color-muted: 131 140 160;
        --color-faint: 76 84 104;
        --color-accent-blue: 110 155 255;
        --color-accent-mint: 110 231 183;
        --color-accent-amber: 245 184 92;
        --color-accent-rose: 242 143 173;
      }

      .light {
        --color-canvas: 247 248 250;
        --color-panel: 255 255 255;
        --color-line: 221 227 238;
        --color-ink: 15 20 32;
        --color-muted: 91 100 120;
        --color-faint: 148 160 184;
        --color-accent-blue: 47 98 224;
        --color-accent-mint: 22 150 105;
        --color-accent-amber: 191 125 33;
        --color-accent-rose: 214 74 116;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 64px 24px 48px;
        font-family: 'Inter', system-ui, sans-serif;
        color: rgb(var(--color-ink));
        background-color: rgb(var(--color-canvas));
        background-image: radial-gradient(
          circle at 1px 1px,
          rgb(var(--color-accent-blue) / 0.09) 1px,
          transparent 0
        );
        background-size: 28px 28px;
        transition: background-color 0.3s, color 0.3s;
        overflow-x: hidden;
        position: relative;
      }

      /* --- glow ambiente, ecoa as cores do robô --- */
      .glow {
        position: fixed;
        pointer-events: none;
        border-radius: 999px;
        filter: blur(110px);
        z-index: 0;
      }
      .glow-blue {
        top: -10%;
        left: 50%;
        width: 560px;
        height: 560px;
        transform: translateX(-50%);
        background: rgb(var(--color-accent-blue) / 0.16);
        animation: drift-a 18s ease-in-out infinite;
      }
      .glow-rose {
        bottom: -15%;
        right: -5%;
        width: 420px;
        height: 420px;
        background: rgb(var(--color-accent-rose) / 0.1);
        animation: drift-b 22s ease-in-out infinite;
      }

      @keyframes drift-a {
        0%,
        100% {
          transform: translate(-50%, 0);
        }
        50% {
          transform: translate(calc(-50% + 30px), 20px);
        }
      }
      @keyframes drift-b {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(-25px, -15px);
        }
      }

      main {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 560px;
      }

      /* --- robô --- */
      .robot-wrap {
        width: min(320px, 68vw);
        margin-bottom: 8px;
        animation: float 6s ease-in-out infinite;
      }

      .robot-wrap img {
        display: block;
        width: 100%;
        height: auto;
        -webkit-mask-image: radial-gradient(closest-side, black 62%, transparent 100%);
        mask-image: radial-gradient(closest-side, black 62%, transparent 100%);
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-14px);
        }
      }

      /* --- entrada escalonada dos textos --- */
      .reveal {
        opacity: 0;
        transform: translateY(16px);
        animation: fade-up 0.6s ease-out forwards;
      }
      @keyframes fade-up {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        color: rgb(var(--color-accent-rose));
        border: 1px solid rgb(var(--color-accent-rose) / 0.3);
        background: rgb(var(--color-accent-rose) / 0.06);
        border-radius: 999px;
        padding: 5px 14px;
        margin-bottom: 20px;
        animation-delay: 0.05s;
      }
      .badge .dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgb(var(--color-accent-rose));
        animation: blink 1.4s step-start infinite;
      }

      .code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        line-height: 1.7;
        color: rgb(var(--color-muted));
        text-align: left;
        border: 1px solid rgb(var(--color-line));
        background: rgb(var(--color-panel));
        border-radius: 10px;
        padding: 16px 18px;
        margin-bottom: 24px;
        animation-delay: 0.15s;
      }
      .code .kw {
        color: rgb(var(--color-accent-rose));
      }
      .code .fn {
        color: rgb(var(--color-accent-blue));
      }
      .code .str {
        color: rgb(var(--color-accent-mint));
      }
      .code .cursor {
        color: rgb(var(--color-ink));
        animation: blink 1s step-start infinite;
      }

      @keyframes blink {
        0%,
        49% {
          opacity: 1;
        }
        50%,
        100% {
          opacity: 0;
        }
      }

      h1 {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        font-size: clamp(56px, 11vw, 88px);
        line-height: 1;
        margin: 0 0 14px;
        background: linear-gradient(90deg, rgb(var(--color-accent-blue)), rgb(var(--color-accent-mint)));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation-delay: 0.25s;
      }

      p.subtitle {
        margin: 0 0 32px;
        color: rgb(var(--color-muted));
        font-size: 15px;
        line-height: 1.7;
        max-width: 420px;
        animation-delay: 0.35s;
      }

      p.subtitle strong {
        color: rgb(var(--color-ink));
        font-weight: 600;
      }

      .actions {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
        animation-delay: 0.45s;
      }

      a.btn {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 8px;
        transition: filter 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
      }

      a.btn:hover {
        transform: translateY(-2px);
      }

      a.btn.primary {
        background: rgb(var(--color-accent-blue));
        color: rgb(var(--color-canvas));
      }
      a.btn.primary:hover {
        filter: brightness(1.1);
      }

      a.btn.secondary {
        border: 1px solid rgb(var(--color-line));
        color: rgb(var(--color-ink));
      }
      a.btn.secondary:hover {
        border-color: rgb(var(--color-accent-mint) / 0.5);
        color: rgb(var(--color-accent-mint));
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
        }
        .reveal {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="glow glow-blue"></div>
    <div class="glow glow-rose"></div>

    <main>
      <div class="robot-wrap">
        <img src="/404-robot.png" alt="Robô fofo segurando um cabo desconectado, com expressão confusa" width="1536" height="1024" />
      </div>

      <span class="badge reveal">
        <span class="dot"></span>
        status: desconectado
      </span>

      <div class="code reveal">
        <span class="kw">const</span> pagina <span class="kw">=</span> <span class="kw">await</span> <span class="fn">plug</span>.connect(<span class="str">location.pathname</span>)<br />
        <span class="fn">// Error:</span> cabo desconectado — nada por aqui<span class="cursor">▌</span>
      </div>

      <h1 class="reveal">404</h1>

      <p class="subtitle reveal">
        Essa página caiu da tomada. O link pode estar quebrado ou ter sido movido —
        <strong>vamos religar você</strong> na página inicial.
      </p>

      <div class="actions reveal">
        <a class="btn primary" href="/">reconectar()</a>
        <a class="btn secondary" href="/#contact">falar_comigo()</a>
      </div>
    </main>
  </body>
</html>
